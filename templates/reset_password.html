{% extends "base.html" %}
{% block content %}

<style>
  body {
    background-image: url("{{ url_for('static', filename='registrarse.jpg') }}");
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: cover;
    background-position: center;
    margin: 0;
    min-height: 100vh;
    color: white;
  }

  .auth-container {
    background: rgba(0,0,0,0.65);
    border-radius: 14px;
    padding: 32px;
    max-width: 420px;
    margin: 6rem auto;
  }

  h1 {
    font-size: 2.3rem;
    margin-bottom: 1.5rem;
  }

  label {
    display: block;
    margin-bottom: 1rem;
    font-size: 1.1rem;
  }

  input {
    width: 100%;
    padding: 0.85rem;
    margin-top: 0.35rem;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 1rem;
  }

  button {
    width: 100%;
    padding: 10px 18px;
    margin-top: 1rem;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #00B3B3, #3DD6C6);
    color: white;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(16, 78, 139, 0.16);
    background: linear-gradient(90deg, #3DD6C6, #104E8B);
  }

  .footer-link {
    display: block;
    margin-top: 1rem;
    color: #cfe2ff;
    text-decoration: none;
  }

  .flash-message {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 0.9rem;
    border-radius: 8px;
    margin-bottom: 1rem;
  }

  .token-info {
    margin-top: 0.25rem;
    padding: 0.85rem;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 0.95rem;
    word-break: break-all;
  }
</style>

<div class="auth-container">
  <h1>Restablecer contraseña</h1>

  {% for message in get_flashed_messages() %}
    <div class="flash-message">{{ message }}</div>
  {% endfor %}

  {% if token %}
    <div class="token-info">
      Código actual: <strong>{{ token }}</strong>
    </div>
  {% endif %}

  <form method="post">
    <label>
      Usuario
      <input name="username" value="{{ username }}" required autocomplete="username">
    </label>
    <label>
      Código de recuperación
      <input name="token" value="{{ token }}" required>
    </label>
    <label>
      Nueva contraseña
      <input type="password" name="password" required autocomplete="new-password">
    </label>
    <label>
      Repetir nueva contraseña
      <input type="password" name="password2" required autocomplete="new-password">
    </label>
    <button type="submit">Cambiar contraseña</button>
  </form>

  <a class="footer-link" href="{{ url_for('login') }}">Volver al login</a>
</div>

{% endblock %}
