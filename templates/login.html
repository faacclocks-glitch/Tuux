{% extends "base.html" %}
{% block content %}

<style>
  body {
    background-image: url("{{ url_for('static', filename='registrarse.jpg') }}");
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: cover;
    background-position: center;
    margin: 0;
    min-height: 100vh;
    color: white;
  }

  .auth-container {
    background: rgba(0, 0, 0, 0.0);
    border-radius: 14px;
    padding: 32px;
    max-width: 420px;
    margin: 6rem auto;
    margin-left: 0px;
    margin-top: 0px;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 1.5rem;
  }

  label {
    display: block;
    margin-bottom: 1rem;
    font-size: 1.2rem;
  }

  input {
    width: 100%;
    padding: 0.8rem 0.9rem;
    margin-top: 0.4rem;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 1rem;
  }

  button {
    width: 30%;
    padding: 10px 18px;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #00B3B3, #3DD6C6);
    color: white;
    cursor: pointer;
    margin-top: 1rem;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(16, 78, 139, 0.16);
    background: linear-gradient(90deg, #3DD6C6, #104E8B);
  }

  .helper-link {
    display: block;
    margin-top: 1rem;
    color: #cfe2ff;
    text-decoration: none;
  }

  .flash-message {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 0.9rem;
    border-radius: 8px;
    margin-bottom: 1rem;
  }
</style>

<div class="auth-container">
  <h1>Iniciar sesión</h1>

  {% for message in get_flashed_messages() %}
    <div class="flash-message">{{ message }}</div>
  {% endfor %}

  <form method="post">
    <label>
      Usuario
      <input name="username" required autocomplete="username">
    </label>
    <label>
      Contraseña
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
  </form>

  <a class="helper-link" href="{{ url_for('forgot_password') }}">¿Olvidaste tu contraseña?</a>
  <a class="helper-link" href="{{ url_for('register') }}">¿No tienes cuenta? Regístrate</a>
</div>

{% endblock %}
